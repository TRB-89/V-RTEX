services:
  - type: web
    name: vortex-solver-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: MAX_CONCURRENT_SOLVES
        value: 1
      - key: SOLVER_TIMEOUT_SECONDS
        value: 15
      - key: MAX_ELEMENTS_LIMIT
        value: 1000000
      - key: MAX_VARIABLES_LIMIT
        value: 10000
      - key: MAX_CONSTRAINTS_LIMIT
        value: 10000
      - key: MAX_SOLVER_MEMORY_MB
        value: 300
      - key: ALLOWED_ORIGINS
        value: "*"
